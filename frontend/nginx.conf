server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # React Router maneja las rutas en el navegador. Sin esta linea, entrar
    # directo a /modelos o recargar esa pagina daria un 404 de Nginx, porque
    # en el disco no existe ningun archivo con ese nombre.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan un hash en el nombre, asi que se pueden cachear para
    # siempre: si cambian, cambia el nombre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip              on;
    gzip_types        text/css application/javascript image/svg+xml;
    gzip_min_length   1024;
}
