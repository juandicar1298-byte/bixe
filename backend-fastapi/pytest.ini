[pytest]
testpaths = tests
python_files = test_*.py

# asyncio_mode = auto evita tener que poner @pytest.mark.asyncio encima de
# cada prueba: toda la API es asíncrona, así que lo son todas.
asyncio_mode = auto

# La base de pruebas se crea y se destruye por prueba, así que cada una
# necesita su propio bucle de eventos.
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers
